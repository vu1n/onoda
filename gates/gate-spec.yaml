# Optimizer promotion gates (A47, A49): the same zero tolerances as
# gates/tolerances.yaml, and the ablation spec's default efficiency gate.
# capability_gain (A52): a strict capability gain also counts as the improvement.
schema: onoda.gate-spec/2
tolerances:
  schema: onoda.ablation-tolerances/1
  justification: "A49: zero worsening on every capability metric, chosen by Vu 2026-09-27"
  capability:
    false_success_claims: "0"
    count.supported: "0"
    count.contradicted: "0"
    count.unsupported: "0"
    count.missing: "0"
    count.unresolved: "0"
efficiency_gate: [context_bytes.total, acquisitions]
capability_gain: true
