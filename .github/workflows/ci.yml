name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pi/package-lock.json
      # Sandbox suites probe bwrap and skip when it cannot run.
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Install Python deps
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Install pinned Pi runtime
        run: scripts/pi-setup.sh
      - name: Typecheck Pi extensions
        run: npx tsc -p .
        working-directory: pi
      - name: Tests
        run: uv run pytest
