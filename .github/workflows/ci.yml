name: CI

# Root and docs prose plus brief governance docs can't change a test result. Tests do read
# experiments/**/*.md, cases/README.md and docs/handoff/examples/, so those still run CI.
on:
  push:
    branches: [main]
    paths-ignore: &prose ["*.md", "docs/**/*.md", ".brief/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
    paths-ignore: *prose

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Drafts, and PRs labelled local-verified (checks already passed in a session), skip CI.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'local-verified'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pi/package-lock.json
      # Sandbox suites probe bwrap and skip when it cannot run.
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Install Python deps
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Install pinned Pi runtime
        run: scripts/pi-setup.sh
      - name: Typecheck Pi extensions
        run: npx tsc -p .
        working-directory: pi
      - name: Tests
        run: uv run pytest
