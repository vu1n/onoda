# Owned by this repo (generated by `brief init --ci` v0.4.2, then pinned to a commit and given
# read-only permissions). Re-running `brief init --ci` leaves it alone; bump both pins by hand
# and read https://github.com/vu1n/brief/blob/main/UPGRADING.md first.
# Pins vu1n/brief@v0.4.2 (commit cb4aa3a); `brief check` reads this tag for its drift warning.
name: brief
on: pull_request
permissions:
  contents: read
jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need the base ref for the range check
      - uses: astral-sh/setup-uv@v5
      - name: brief governance gate
        # pinned to the v0.4.2 commit; a tag can move, a commit cannot
        run: uvx --from git+https://github.com/vu1n/brief@cb4aa3a5c499ab60563c1d885d08222f433e581e brief check --base "origin/${{ github.base_ref }}"
      - name: brief doctor (advisory — latent drift; does not block)
        if: always()   # surface drift even when the gate blocks, for the human PR view
        run: uvx --from git+https://github.com/vu1n/brief@cb4aa3a5c499ab60563c1d885d08222f433e581e brief doctor --repo .
      - name: brief update check (advisory)
        if: always()
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/vu1n/brief 'v*' | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$latest" ] && [ "$latest" != "v0.4.2" ] \
             && [ "$(printf '%s\n' v0.4.2 "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "::notice title=brief $latest is available (this repo pins v0.4.2)::Read https://github.com/vu1n/brief/blob/$latest/UPGRADING.md for what to do, then bump both pins in this file by hand and commit."
          fi
