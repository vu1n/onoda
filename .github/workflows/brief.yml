# Owned by this repo (generated by `brief init --ci` v0.2.0, then pinned to a commit and given
# read-only permissions). Re-running `brief init --ci` would overwrite these edits.
name: brief
on: pull_request
permissions:
  contents: read
jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need the base ref for the range check
      - uses: astral-sh/setup-uv@v5
      - name: brief governance gate
        # pinned to the v0.2.0 commit; a tag can move, a commit cannot
        run: uvx --from git+https://github.com/vu1n/brief@ac51d05004177bdd6bed89d9231ab3f41d0ba1b8 brief check --base "origin/${{ github.base_ref }}"
      - name: brief doctor (advisory — latent drift; does not block)
        if: always()   # surface drift even when the gate blocks, for the human PR view
        run: uvx --from git+https://github.com/vu1n/brief@ac51d05004177bdd6bed89d9231ab3f41d0ba1b8 brief doctor --repo .
      - name: brief update check (advisory)
        if: always()
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/vu1n/brief 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
          if [ -n "$latest" ] && [ "$latest" != "v0.2.0" ] \
             && [ "$(printf '%s\n' v0.2.0 "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "::notice title=brief $latest is available (this repo pins v0.2.0)::Upgrade: uvx --from git+https://github.com/vu1n/brief@$latest brief init --ci --with-skills, then commit."
          fi
