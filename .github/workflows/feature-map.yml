name: Feature map
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  feature-map:
    name: Feature map pointers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check feature map pointers
        run: python3 scripts/featuremap.py check
