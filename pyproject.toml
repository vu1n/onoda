[project]
name = "onoda"
version = "0.1.0"
description = "Portable, forkable run records for scientific-agent experiments (onoda CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gepa==0.1.4",
    "pydantic>=2.9,<3",
    "pyyaml>=6",
    "rfc8785==0.1.4",
]

[project.scripts]
onoda = "onoda.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cclib==1.9rc1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv.build-backend]
module-name = "onoda"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `# Context: doc://...` decision refs (CLAUDE.md, brief) run past the line limit.
task-tags = ["TODO", "FIXME", "XXX", "Context"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
